server:
  port: 8080

spring:
  application:
    name: phishshield-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/phishshield}
    username: ${SPRING_DATASOURCE_USERNAME:phishshield_user}
    password: ${SPRING_DATASOURCE_PASSWORD:phishshield_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:phishshield}
    password: ${SPRING_RABBITMQ_PASSWORD:phishshield}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.phishshield: INFO
    org.springframework.web: INFO
